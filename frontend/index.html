<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>SRS - Flashcards</title>
</head>
<body>

    <header class="topbar">
        <span class="logo">🧠 SRS</span>
    </header>

    <main class="container">

        <!-- TELA 1: GESTÃO -->
        <div id="tela-gestao">
            <section class="create-section">
                <h2 class="section-title">Add to deck</h2>
                <div class="card-form">
                    <input type="text" id="frente" placeholder="Frente (ex: The Apple)" maxlength="200">
                    <input type="text" id="verso" placeholder="Verso (ex: A maçã)" maxlength="200">
                    <button type="button" id="btn-salvar">Save your card</button>
                    <button type="button" id="btn-estudar" onclick="abrirEstudo()">Study Now</button>
                    <p id="mensagem" class="msg"></p>
                </div>
            </section>

            <section class="cards-section">
                <h2 class="section-title">Saved Cards</h2>
                <div id="cards-grid" class="cards-grid"></div>
                <p id="empty-msg" class="empty-msg">Nenhum cartão ainda. Crie o seu primeiro! 🃏</p>
            </section>
        </div>

        <!-- TELA 2: ESTUDO -->
        <div id="tela-estudo" style="display: none;">
            <div class="estudo-header">
                <button type="button" class="btn-voltar" onclick="voltarGestao()">← Sair da Sessão</button>
                <span id="progresso-texto">Card 1 de X</span>
            </div>

            <div id="card-revisao" class="card-item-grande"></div>

            <div id="area-revelar">
                <button type="button" onclick="revelarVerso()" class="btn-principal">Revelar Resposta</button>
            </div>

            <div id="controles-revisao" class="controles-grade" style="display: none;">
                <button type="button" onclick="enviarRevisao(0, event)" class="btn-rating again">Again</button>
                <button type="button" onclick="enviarRevisao(1, event)" class="btn-rating hard">Hard</button>
                <button type="button" onclick="enviarRevisao(2, event)" class="btn-rating good">Good</button>
                <button type="button" onclick="enviarRevisao(3, event)" class="btn-rating easy">Easy</button>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
